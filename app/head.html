<title>Solmetar</title>
<meta name="description" content="Pokazna aplikacija završnog rada: procjena satne proizvodnje fotonaponskih sistema neuronskim mrežama (MLP, LSTM) na osnovu vremenskih podataka, za Limburg (Belgija) i gradove u BiH.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* =====================================================================
   head.html - IZGLED APLIKACIJE (CSS)
   :root definiše boje kao promjenljive (--ink, --accent, boje serija --s-mlp...).
   Za tamni režim iste promjenljive dobijaju druge vrijednosti, pa ostatak
   stilova ne mora znati koji je režim uključen.
   ===================================================================== */
:root{
  --ground:#F2F4F7; --panel:#FFFFFF; --panel-2:#F7F8FA; --ink:#18202A; --muted:#5A6573; --line:#D6DCE4;
  --accent:#2B5C9E; --accent-soft:#E3EBF6; --measured:#18202A;
  --s-lr:#B8691F; --s-mlp:#2B5C9E; --s-lstm:#9E2B4D; --s-elia:#2E7D4F; --sun:#D99A0B;
  --ok:#2E7D4F; --warn:#A66A00;
  --f-body:"IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-disp:"IBM Plex Sans Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, "Courier New", monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#10151B; --panel:#171E26; --panel-2:#1D2530; --ink:#E4E9EF; --muted:#98A3B1; --line:#2C3743;
    --accent:#7DA7E0; --accent-soft:#1F2D40; --measured:#E4E9EF;
    --s-lr:#E0995A; --s-mlp:#7DA7E0; --s-lstm:#E07D9B; --s-elia:#63BE8A; --sun:#E8B33A; --ok:#63BE8A; --warn:#E0A94A;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#10151B; --panel:#171E26; --panel-2:#1D2530; --ink:#E4E9EF; --muted:#98A3B1; --line:#2C3743;
  --accent:#7DA7E0; --accent-soft:#1F2D40; --measured:#E4E9EF;
  --s-lr:#E0995A; --s-mlp:#7DA7E0; --s-lstm:#E07D9B; --s-elia:#63BE8A; --sun:#E8B33A; --ok:#63BE8A; --warn:#E0A94A;
}
/* ---------- osnovni raspored stranice, zaglavlje i logo ---------- */
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:0 32px}
.wrap{max-width:1180px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:22px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand .logo{width:52px;height:52px;flex:none}
:root{--logo-gap:var(--ground)}
.brand h1{font:600 30px/1 var(--f-disp);letter-spacing:.01em;margin:0}
.brand h1 span{color:var(--sun)}
.brand p{margin:0;color:var(--muted);font-size:14px;max-width:60ch}
.sys{font:500 12px/1.4 var(--f-mono);color:var(--muted);text-align:right}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-block:14px 18px}
nav.tabs button{font:500 14px var(--f-body);color:var(--muted);background:transparent;border:1px solid transparent;border-radius:999px;padding:7px 14px;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h2{font:600 17px/1.2 var(--f-disp);margin:0 0 10px;letter-spacing:.01em}
.panel h3{font:600 12px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}
.panel h3:first-child{margin-top:0}
#gen-panel h3,#scen-panel h3{margin-top:16px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=date],input[type=number],select{width:100%;font:500 14px var(--f-mono);color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.row{display:flex;gap:8px;align-items:center}
.btn{font:500 13px var(--f-body);background:var(--panel-2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn:disabled{opacity:.5;cursor:default}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px;margin:0;cursor:pointer}
.sw{display:inline-block;width:18px;height:3px;border-radius:2px}
.slider{margin-bottom:10px}
.slider .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.slider .lab b{font:500 13px var(--f-mono);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.chip{display:inline-block;font:500 11px var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi .k{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font:500 22px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .v small{font-size:12px;color:var(--muted);margin-left:3px}
.kpi .d{font:12px var(--f-mono);color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.chart .gridl{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;margin-top:6px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.tablewrap{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font:13px var(--f-mono);font-variant-numeric:tabular-nums}
th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font:600 12px var(--f-body);color:var(--muted);text-align:right;position:sticky;top:0;background:var(--panel)}
th:first-child,td:first-child{text-align:left}
tr.night td{color:var(--muted);opacity:.6}
details summary{cursor:pointer;color:var(--accent);font-size:14px;margin-top:12px}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.form{grid-template-columns:repeat(2,minmax(0,1fr))}}
.result{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.meter{height:10px;border-radius:5px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%}
.progress{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;margin:10px 0}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.okmark{color:var(--ok);font-weight:600}
.prose{max-width:72ch}
.prose p{margin:0 0 10px}
.prose code{font:13px var(--f-mono);background:var(--panel-2);padding:1px 5px;border-radius:4px}
footer{margin-top:22px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.unitrow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px}
.src{font:12px var(--f-mono);color:var(--muted);margin-top:6px}
.msg{padding:10px 12px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:14px;margin-bottom:12px}
</style>
